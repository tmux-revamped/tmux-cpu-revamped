set -g default-terminal "tmux-256color"
set -g escape-time 1000
set -g status 2
set -g status-interval 1
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[default] "
set -g status-left-length 20
set -g status-right ""
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#cba6f7,bold] #I:#W "
set -g @revamped_screen_keys ""
set -g status-format[1] "#[align=centre]#{?#{@revamped_screen_keys},#[fg=#1e1e2e#,bg=#f9e2af#,bold] #{@revamped_screen_keys} ,}"
set -g default-command "bash --noprofile --rcfile '$SCREENS_REPO/screens/setup.sh'"
bind -n C-] command-prompt -p "" "set -g @revamped_screen_keys '%%'"
set -g display-time 3000
set-environment -g PATH "/Users/Shared/demo/bin:/usr/bin:/bin:/usr/sbin:/sbin"
set -g status-right "#{cpu_bg_color}#{cpu_fg_color}#{cpu_icon} #{cpu_percentage}#[default] #{cpu_temp_fg_color}#{cpu_temp}#[default] #{cpu_freq} #{cpu_load_color}#{cpu_load}#[default] #{cpu_alert}"
set -g status-right-length 110
set -g @cpu_revamped_interval 1
set -g @cpu_revamped_detail_interval 5
set -g @cpu_revamped_low_fg_color "#[fg=#a6e3a1]"
set -g @cpu_revamped_medium_fg_color "#[fg=#f9e2af]"
set -g @cpu_revamped_high_fg_color "#[fg=#f38ba8]"
set -g @cpu_revamped_low_bg_color "#[bg=#313244]"
set -g @cpu_revamped_medium_bg_color "#[bg=#45475a]"
set -g @cpu_revamped_high_bg_color "#[bg=#585b70]"
set -g @cpu_revamped_temp_low_fg_color "#[fg=#a6e3a1]"
set -g @cpu_revamped_temp_medium_fg_color "#[fg=#f9e2af]"
set -g @cpu_revamped_temp_high_fg_color "#[fg=#f38ba8]"
set -g @cpu_revamped_temp_low_bg_color "#[bg=#313244]"
set -g @cpu_revamped_temp_medium_bg_color "#[bg=#45475a]"
set -g @cpu_revamped_temp_high_bg_color "#[bg=#585b70]"
set -g @cpu_revamped_temp_low_icon "cool "
set -g @cpu_revamped_temp_medium_icon "warm "
set -g @cpu_revamped_temp_high_icon "hot "
set -g @cpu_revamped_alert_icon "ALERT"
run-shell /Users/Shared/demo/tmux-cpu-revamped/cpu-revamped.tmux
